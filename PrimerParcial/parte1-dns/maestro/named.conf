// Archivo principal de configuración de BIND9 en el servidor maestro.

// Carga las opciones generales del servidor:
// interfaces, recursión, allow-query, RRL y DNSSEC.
include "/etc/bind/named.conf.options";

// Carga las zonas autoritativas y la configuración
// de transferencias seguras hacia el esclavo.
include "/etc/bind/named.conf.local";

// Carga las zonas predeterminadas proporcionadas por BIND.
include "/etc/bind/named.conf.default-zones";

// Configuración de auditoría.
// Se almacenan consultas, transferencias y eventos
// de seguridad en archivos separados.
logging {

    // Registro de consultas DNS recibidas.
    channel queries_log {
        file "/var/log/named/queries.log" versions 3 size 5m;
        severity info;
        print-time yes;
    };

    // Registro de transferencias AXFR e IXFR.
    channel transfers_log {
        file "/var/log/named/transfers.log" versions 3 size 5m;
        severity info;
        print-time yes;
    };

    // Registro de eventos de seguridad,
    // incluyendo transferencias de zona no autorizadas.
    channel security_log {
        file "/var/log/named/security.log" versions 3 size 5m;
        severity info;
        print-time yes;
    };

    // Consultas DNS.
    category queries {
        queries_log;
    };

    // Transferencias recibidas.
    category xfer-in {
        transfers_log;
    };

    // Transferencias enviadas.
    category xfer-out {
        transfers_log;
    };

    // Eventos relacionados con seguridad.
    category security {
        security_log;
    };
};
