# ============================================================
# VSFTPD - SEGUNDO PARCIAL SERVICIOS TELEMATICOS
# FTPS EXPLICITO
# ============================================================

listen=YES
listen_ipv6=NO

# Usuarios locales
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Registro
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES

# Seguridad del usuario
chroot_local_user=YES
allow_writeable_chroot=YES

secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# ============================================================
# TLS / FTPS EXPLICITO
# ============================================================

ssl_enable=YES
allow_anon_ssl=NO

force_local_logins_ssl=YES
force_local_data_ssl=YES

ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO

require_ssl_reuse=NO

rsa_cert_file=/etc/ssl/ftps/servidor.crt
rsa_private_key_file=/etc/ssl/ftps/servidor.key

# ============================================================
# FTP PASIVO
# ============================================================

pasv_enable=YES
pasv_min_port=50000
pasv_max_port=50010

# IP que observa el cliente: SERVIDOR 1
pasv_address=192.168.56.10
